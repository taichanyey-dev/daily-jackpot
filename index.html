

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DAILY JACKPOT</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 25px 16px;
  background: #101426;
  color: white;
  font-family: sans-serif;
  text-align: center;
}
h1 { color: #ffd45c; }
.card {
  background: #202740;
  border-radius: 18px;
  padding: 24px;
  margin: 20px auto;
  max-width: 420px;
}
input {
  width: 100%;
  padding: 15px;
  margin: 8px 0;
  border: 1px solid #64708a;
  border-radius: 10px;
  font-size: 16px;
}
button {
  width: 100%;
  padding: 15px;
  margin: 8px 0;
  border: none;
  border-radius: 12px;
  background: #ffd45c;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}
button:disabled { opacity: .5; }
.secondary { background: #8793ae; }
.prize {
  color: #ffd45c;
  font-size: 36px;
  font-weight: bold;
}
.note {
  color: #bdc5d8;
  font-size: 13px;
}
#app { display: none; }
#message { overflow-wrap: anywhere; }

.history-list {
  display: grid;
  gap: 12px;
  margin-top: 15px;
}

.history-item {
  background: #303b5c;
  border: 1px solid #ffd45c;
  border-radius: 12px;
  padding: 16px;
  text-align: left;
}

.history-item strong {
  color: #ffd45c;
  font-size: 17px;
}

</style>
</head>
<body>

<h1>DAILY JACKPOT</h1>
<p>毎日1人のジャックポット！</p>

<div class="card">
  <p>本日のデモ賞金</p>
  <div class="prize">100,000 PT</div>

<p>次の抽選まで</p>
<h2 id="countdown">計算中...</h2>
<p class="note">毎日23:59に抽選</p>

  <p class="note">換金不可・実際の賞金ではありません</p>
</div>

<div class="card" id="auth">
  <h2>会員登録・ログイン</h2>
  <input id="email" type="email"
    placeholder="メールアドレス" autocomplete="email">
  <input id="password" type="password"
    placeholder="パスワード（6文字以上）"
    autocomplete="current-password">
  <button id="signup" onclick="signup()">
    新規会員登録
  </button>
  <button id="login" onclick="login()"
    class="secondary">
    ログイン
  </button>
</div>

<div class="card" id="app">
  <h2>マイページ</h2>
  <p id="username"></p>
  <p>あなたのデモ抽選口数</p>
  <h2 id="tickets">0口</h2>

<div class="card">
  <h3>本日の参加状況</h3>
  <p>参加人数</p>
  <h2 id="participants">読み込み中...</h2>

<p>あなたの当選確率</p>
<h2 id="winProbability">計算中...</h2>
<p class="note">抽選前の参考確率です</p>

  <p>全体の抽選口数</p>
  <h2 id="totalTickets">読み込み中...</h2>
</div>



<button id="ticketButton" onclick="startDemoAd()">


    無料でデモ抽選券を1口獲得
  </button>

<p id="adStatus" class="note"></p>

  
<div class="card">
  <h2>🏆 過去の当選履歴</h2>

<div id="drawHistory" class="history-list">

    履歴を読み込み中...
  </div>
</div>

<button onclick="logout()" class="secondary">
    ログアウト
  </button>
</div>

<p id="message" class="note"></p>

<div class="card" id="drawResult" style="display:none;">
  <h2>🎰 本日の抽選結果</h2>
  <p id="drawResultText">結果を確認中...</p>
</div>

<p class="note">
  試作品です。現金・広告・実際の抽選はありません。
  抽選口数はブラウザ内だけのデモデータです。
</p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://egfztpubtlqsvxtkgaag.supabase.co";
const SUPABASE_KEY = "sb_publishable_HCZmmCSr0eW6ZNxdVY5sww_vgLX0RKW";

let client;
let currentUser = null;
let tickets = 0;

const message = document.getElementById("message");

function showMessage(text) {
  message.textContent = text;
}

async function showUser(user) {
  currentUser = user;
  document.getElementById("auth").style.display =
    user ? "none" : "block";
  document.getElementById("app").style.display =
    user ? "block" : "none";

  if (user) {
    document.getElementById("username").textContent =
      user.email || "ログイン中";
    
const { data, error } = await client
  .from("demo_tickets")
  .select("tickets, ticket_date")
  .eq("user_id", user.id)
  .maybeSingle();

if (error) {
  showMessage("読み込みエラー：" + error.message);
  return;
}


const today = new Date().toLocaleDateString("sv-SE", {
  timeZone: "Asia/Tokyo"
});

tickets = data?.ticket_date === today
  ? data.tickets
  : 0;


    document.getElementById("tickets").textContent =
      tickets + "口";

loadDrawResult();
loadStats();
loadDrawHistory();
} else {

    tickets = 0;
  }
}

async function signup() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || password.length < 6) {
    showMessage("メールアドレスと6文字以上のパスワードを入力してな");
    return;
  }

  const {data, error} = await client.auth.signUp({
    email,
    password,
    options: {
      emailRedirectTo: window.location.origin +
        window.location.pathname
    }
  });

  if (error) {
    showMessage("登録エラー：" + error.message);
  } else if (data.session) {
    showMessage("登録できたで！");
  } else {
    showMessage(
      "確認メールを送ったで！メールのリンクを開いてな。"
    );
  }
}

async function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const {error} = await client.auth.signInWithPassword({
    email, password
  });

  showMessage(error ?
    "ログインエラー：" + error.message :
    "ログイン成功！");
}

async function logout() {
  const {error} = await client.auth.signOut();
  if (error) showMessage(error.message);
  else showMessage("ログアウトしたで！");
}



let ticketRequestPending = false;



let demoAdRunning = false;

async function startDemoAd() {
  if (demoAdRunning || ticketRequestPending ||
      !currentUser) return;

  demoAdRunning = true;
updateCountdown();

  const status = document.getElementById("adStatus");

  try {
    for (let i = 15; i > 0; i--) {
      status.textContent =
        "📺 デモ広告視聴中...残り" + i + "秒";

      await new Promise(resolve =>
        setTimeout(resolve, 1000)
      );
    }

    status.textContent =
      "✅ デモ視聴完了！抽選券を申請中...";

    await getTicket();

    status.textContent =
      "デモ終了！抽選券の獲得結果を確認してな。";
  
} finally {
  demoAdRunning = false;
  updateCountdown();
}

}

async function getTicket() {
  if (!currentUser || ticketRequestPending) return;

  ticketRequestPending = true;
updateCountdown();

  try {
    const { data, error } = await client.rpc(
      "claim_demo_ticket"
    );

    if (error) {
      showMessage("エラー：" + error.message);
      return;
    }

    tickets = data;

    document.getElementById("tickets").textContent =
      tickets + "口";

    showMessage("デモ抽選券を1口獲得！");
    loadStats();

  } catch (error) {
    showMessage("通信エラー：" + error.message);
  
} finally {
  ticketRequestPending = false;
  updateCountdown();
}

}




async function loadDrawResult() {
  const box = document.getElementById("drawResult");
  const result = document.getElementById("drawResultText");

  if (!currentUser) {
    box.style.display = "none";
    return;
  }

  const { data, error } = await client.rpc(
    "get_today_demo_result"
  );

  box.style.display = "block";

  if (error) {
    result.textContent = "結果を取得できませんでした";
  } else if (!data || data.length === 0) {
    result.textContent = "本日の抽選はまだです！";
  } else if (data[0].is_winner) {
    result.textContent = "🎉 おめでとう！本日の当選者です！";
  } else {
    result.textContent = "今回はハズレ！また明日！";
  }
}


async function loadStats() {
  const { data, error } = await client.rpc(
    "get_today_demo_stats"
  );

  if (error) {
    showMessage("参加状況の取得エラー：" + error.message);
    return;
  }

  const stats = data?.[0];

const total = Number(stats?.total_tickets ?? 0);

const probability = total > 0
  ? (tickets / total) * 100
  : 0;

document.getElementById("winProbability").textContent =
  probability.toFixed(2) + "%";


  document.getElementById("participants").textContent =
    (stats?.participants ?? 0) + "人";

  document.getElementById("totalTickets").textContent =
    (stats?.total_tickets ?? 0) + "口";
}


async function loadDrawHistory() {
  const historyBox =
    document.getElementById("drawHistory");

  const { data, error } = await client.rpc(
    "get_demo_draw_history"
  );

  if (error) {
    historyBox.textContent =
      "履歴を読み込めませんでした";
    return;
  }

  if (!data || data.length === 0) {
    historyBox.textContent =
      "まだ抽選履歴がありません";
    return;
  }

 
historyBox.replaceChildren();

data.forEach(draw => {
  const card = document.createElement("div");
  card.className = "history-item";

  const title = document.createElement("strong");
  title.textContent = "🏆 " + draw.draw_date;

  const details = document.createElement("p");
  details.textContent =
    "総抽選口数：" + draw.total_entries + "口";

  card.appendChild(title);
  card.appendChild(details);
  historyBox.appendChild(card);
});

}

async function init() {
  if (SUPABASE_URL.startsWith("ここに") ||
      SUPABASE_KEY.startsWith("ここに")) {
    showMessage("Supabaseの接続情報を入力してな");
    return;
  }

  try {
    client = window.supabase.createClient(
      SUPABASE_URL, SUPABASE_KEY
    );

    client.auth.onAuthStateChange((_event, session) => {
      showUser(session?.user || null);
    });

    const {data, error} = await client.auth.getSession();
    if (error) throw error;
    showUser(data.session?.user || null);
  } catch (error) {
    showMessage("接続エラー：" + error.message);
  }
}



setInterval(() => {
  if (currentUser) {
    loadStats();
    loadDrawResult();
  }
}, 30000);



function updateCountdown() {
  const now = new Date();

const japanTime = new Intl.DateTimeFormat("en-GB", {
  timeZone: "Asia/Tokyo",
  hour: "2-digit",
  minute: "2-digit",
  hourCycle: "h23"
}).format(now);

const ticketButton =
  document.getElementById("ticketButton");

if (ticketButton) {
  const closed = japanTime >= "23:59";

  

ticketButton.disabled =
  closed || ticketRequestPending || demoAdRunning;



ticketButton.textContent = closed
  ? "抽選中..."
  : demoAdRunning
    ? "📺 デモ広告視聴中..."
    : ticketRequestPending
      ? "処理中..."
      : "無料でデモ抽選券を1口獲得";


}


  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: "Asia/Tokyo",
    year: "numeric",
    month: "numeric",
    day: "numeric"
  }).formatToParts(now);

  const get = type =>
    Number(parts.find(p => p.type === type).value);

  let target = Date.UTC(
    get("year"),
    get("month") - 1,
    get("day"),
    14, 59, 0
  );

  if (target <= now.getTime()) {
    target += 86400000;
  }

  const seconds = Math.ceil(
    (target - now.getTime()) / 1000
  );

  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;

  const pad = n => String(n).padStart(2, "0");

  document.getElementById("countdown").textContent =
    `${pad(h)}:${pad(m)}:${pad(s)}`;
}

updateCountdown();
setInterval(updateCountdown, 1000);

init();
</script>
</body>
</html>
